openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AI Nutrition Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: entries
    description: Food log entries
  - name: ai
    description: AI food analysis
  - name: summary
    description: Nutrition summaries
paths:
  /fitness:
    get:
      operationId: getFitness
      tags: [fitness]
      summary: Fitness goal, visits and reminder status for this browser
      responses:
        "200":
          description: Fitness dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FitnessDashboard"
  /fitness/visits:
    post:
      operationId: createFitnessVisit
      tags: [fitness]
      summary: Record one gym visit per day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FitnessVisitInput"
      responses:
        "201":
          description: Visit recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FitnessDashboard"
        "409":
          description: Visit already exists for this date
  /fitness/visits/{id}:
    delete:
      operationId: deleteFitnessVisit
      tags: [fitness]
      summary: Remove a mistaken visit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Updated fitness dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FitnessDashboard"
        "404":
          description: Visit not found
  /fitness/push-config:
    get:
      operationId: getFitnessPushConfig
      tags: [fitness]
      responses:
        "200":
          description: Public OneSignal configuration
          content:
            application/json:
              schema:
                type: object
                required: [appId, externalId]
                properties:
                  appId:
                    type: string
                  externalId:
                    type: string
  /fitness/reminders:
    put:
      operationId: saveFitnessReminders
      tags: [fitness]
      summary: Set two weekly reminder days and schedule four weeks ahead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FitnessReminderInput"
      responses:
        "200":
          description: Saved and scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FitnessDashboard"
        "502":
          description: Reminder provider failed; visits remain saved
  /fitness/reminders/refresh:
    post:
      operationId: refreshFitnessReminders
      tags: [fitness]
      summary: Extend reminders when the app is opened
      responses:
        "200":
          description: Updated reminder status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FitnessDashboard"
  /fitness/reminders/test:
    post:
      operationId: testFitnessReminder
      tags: [fitness]
      summary: Send one test notification to this device only
      responses:
        "200":
          description: Test accepted by OneSignal
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /entries:
    get:
      operationId: listEntries
      tags: [entries]
      summary: List food log entries
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            description: "ISO date string (YYYY-MM-DD), defaults to today"
      responses:
        "200":
          description: List of entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FoodEntry"
    post:
      operationId: createEntry
      tags: [entries]
      summary: Log a food entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodEntry"

  /entries/{id}:
    get:
      operationId: getEntry
      tags: [entries]
      summary: Get a food entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Food entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodEntry"
        "404":
          description: Not found
    patch:
      operationId: updateEntry
      tags: [entries]
      summary: Update a food entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodEntryUpdate"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodEntry"
        "404":
          description: Not found
    delete:
      operationId: deleteEntry
      tags: [entries]
      summary: Delete a food entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /analyze-food:
    post:
      operationId: analyzeFood
      tags: [ai]
      summary: AI food analysis — returns nutritional info for a described food
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodAnalysisRequest"
      responses:
        "200":
          description: Nutritional analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodAnalysisResult"

  /analyze-food-image:
    post:
      operationId: analyzeFoodImage
      tags: [ai]
      summary: AI food analysis from an image — returns nutritional info by scanning a photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodImageAnalysisRequest"
      responses:
        "200":
          description: Nutritional analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodAnalysisResult"

  /summary/daily:
    get:
      operationId: getDailySummary
      tags: [summary]
      summary: Get daily nutrition summary
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            description: "ISO date string (YYYY-MM-DD), defaults to today"
      responses:
        "200":
          description: Daily summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailySummary"

  /summary/weekly:
    get:
      operationId: getWeeklySummary
      tags: [summary]
      summary: Get weekly calorie data for chart
      responses:
        "200":
          description: Weekly summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DayCalories"

  /history:
    get:
      operationId: getHistory
      tags: [summary]
      summary: Get past days with their summaries
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: History entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailySummary"

components:
  schemas:
    FitnessVisitInput:
      type: object
      required: [date]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
    FitnessReminderInput:
      type: object
      required: [enabled, days, time, timezone]
      properties:
        enabled:
          type: boolean
        days:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 7
        time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        timezone:
          type: string
          minLength: 1
          maxLength: 80
        subscriptionId:
          type: ["string", "null"]
    FitnessDashboard:
      type: object
      required: [goal, weekStart, weekEnd, today, count, visits, reminders]
      properties:
        goal:
          type: integer
        weekStart:
          type: string
        weekEnd:
          type: string
        today:
          type: string
        count:
          type: integer
        visits:
          type: array
          items:
            type: object
            required: [id, date]
            properties:
              id:
                type: integer
              date:
                type: string
        reminders:
          type: object
          required: [enabled, days, time, timezone, scheduledUntil, nextReminder, error, scheduledCount]
          properties:
            enabled:
              type: boolean
            days:
              type: array
              items:
                type: integer
            time:
              type: string
            timezone:
              type: string
            scheduledUntil:
              type: ["string", "null"]
            nextReminder:
              type: ["string", "null"]
            error:
              type: ["string", "null"]
            scheduledCount:
              type: integer
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    FoodEntry:
      type: object
      required: [id, name, calories, protein, carbs, fat, mealType, loggedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        calories:
          type: number
        protein:
          type: number
        carbs:
          type: number
        fat:
          type: number
        servingSize:
          type: ["string", "null"]
        mealType:
          type: string
          enum: [breakfast, lunch, dinner, snack]
        loggedAt:
          type: string
          description: ISO timestamp

    FoodEntryInput:
      type: object
      required: [name, calories, protein, carbs, fat, mealType]
      properties:
        name:
          type: string
        calories:
          type: number
        protein:
          type: number
        carbs:
          type: number
        fat:
          type: number
        servingSize:
          type: string
        mealType:
          type: string
          enum: [breakfast, lunch, dinner, snack]
        loggedAt:
          type: string
          description: ISO timestamp (optional, defaults to now)

    FoodEntryUpdate:
      type: object
      properties:
        name:
          type: string
        calories:
          type: number
        protein:
          type: number
        carbs:
          type: number
        fat:
          type: number
        servingSize:
          type: string
        mealType:
          type: string
          enum: [breakfast, lunch, dinner, snack]

    FoodAnalysisRequest:
      type: object
      required: [description]
      properties:
        description:
          type: string
          description: Natural language description of the food (e.g. "a bowl of oatmeal with banana")

    FoodImageAnalysisRequest:
      type: object
      required: [imageBase64, mimeType]
      properties:
        imageBase64:
          type: string
          description: Base64-encoded image data
        mimeType:
          type: string
          description: MIME type of the image (e.g. image/jpeg, image/png, image/webp)

    FoodAnalysisResult:
      type: object
      required: [name, calories, protein, carbs, fat, servingSize, confidence]
      properties:
        name:
          type: string
        calories:
          type: number
        protein:
          type: number
        carbs:
          type: number
        fat:
          type: number
        servingSize:
          type: string
        confidence:
          type: string
          enum: [high, medium, low]
        notes:
          type: ["string", "null"]

    DailySummary:
      type: object
      required: [date, totalCalories, totalProtein, totalCarbs, totalFat, entryCount, calorieGoal]
      properties:
        date:
          type: string
        totalCalories:
          type: number
        totalProtein:
          type: number
        totalCarbs:
          type: number
        totalFat:
          type: number
        entryCount:
          type: integer
        calorieGoal:
          type: integer

    DayCalories:
      type: object
      required: [date, calories, label]
      properties:
        date:
          type: string
        calories:
          type: number
        label:
          type: string
